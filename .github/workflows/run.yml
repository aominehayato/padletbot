name: Padlet Bot Execution

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 依存関係のインストール
        run: npm install

      - name: Botスクリプトの実行
        env:
          PADLET_EMAIL: ${{ secrets.PADLET_EMAIL }}
          PADLET_PASSWORD: ${{ secrets.PADLET_PASSWORD }}
          PADLET_COOKIES_JSON: ${{ secrets.PADLET_COOKIES_JSON }}
          PADLET_SESSION_COOKIE: ${{ secrets.PADLET_SESSION_COOKIE }}
        run: npm start
