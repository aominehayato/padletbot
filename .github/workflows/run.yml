name: Padlet Bot Execution

on:
  schedule:
    # 1時間ごとに自動実行する設定（Cron形式）
    - cron: '0 * * * *'
  workflow_dispatch:
    # GitHubのWeb画面から手動で即時実行ボタンを押すことも可能です

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存関係のインストール
        run: npm install

      - name: Botスクリプトの実行
        run: npm start
