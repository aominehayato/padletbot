name: Padlet Bot Execution

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 依存関係のインストール
        run: npm install

      - name: 前回プロファイルの復元
        uses: actions/download-artifact@v4
        with:
          name: padlet-profile-bot
          path: profiles/bot
        continue-on-error: true

      - name: Botスクリプトの実行
        run: npm start

      - name: プロファイルの保存
        uses: actions/upload-artifact@v4
        with:
          name: padlet-profile-bot
          path: profiles/bot
          overwrite: true
