name: Padlet Bot Execution

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 依存関係のインストール
        run: npm install

      - name: 前回プロファイルの復元
        uses: actions/download-artifact@v4
        with:
          name: padlet-profiles
          path: .
        continue-on-error: true

      - name: Botスクリプトの実行
        env:
          PADLET_API_KEY: ${{ secrets.PADLET_API_KEY }}
        run: npm run bot

      - name: 不要キャッシュ削除
        run: |
          rm -rf profiles/bot/Default/Cache
          rm -rf profiles/bot/Default/"Code Cache"

      - name: プロファイルの保存
        uses: actions/upload-artifact@v4
        with:
          name: padlet-profiles
          path: profiles
          retention-days: 30
          overwrite: true
